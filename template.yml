---
# Builds the Ubuntu cloud-init template VMs are cloned from.
#
#   make pve-template
- name: Build cloud-init template
  hosts: pve
  gather_facts: false

  vars:
    template_image_path: "/{{ pve_iso_dataset }}/template/iso/{{ template_image_name }}"

  tasks:
    - name: Download cloud image
      ansible.builtin.get_url:
        url: "{{ template_image_url }}"
        dest: "{{ template_image_path }}"
        checksum: "sha256:{{ template_image_sha256 }}"
        mode: "0644"

    # Ubuntu cloud images ship without the guest agent; every clone gets it
    # from this vendor snippet.
    #
    # netplan apply works around a 26.04 first-boot race where cloud-init
    # can't rename ens18 to eth0 ("[busy] Error renaming"), leaving the VM on
    # a DHCP address instead of its static IP. Harmless when the rename worked.
    # https://github.com/canonical/cloud-init/issues/6887
    - name: Create snippets dir
      ansible.builtin.file:
        path: "/{{ pve_iso_dataset }}/snippets"
        state: directory
        mode: "0755"

    - name: Write vendor cloud-init snippet
      ansible.builtin.copy:
        dest: "/{{ pve_iso_dataset }}/snippets/{{ template_vendor_snippet }}"
        content: |
          #cloud-config
          packages:
            - qemu-guest-agent
          runcmd:
            - netplan apply
            - systemctl enable --now qemu-guest-agent
        mode: "0644"

    - name: Check for template
      ansible.builtin.command: qm config {{ template_vmid }}
      register: template_config
      changed_when: false
      failed_when: false

    - name: Refuse to use a VMID that isn't the finished template
      ansible.builtin.fail:
        msg: >-
          VMID {{ template_vmid }} exists but isn't a template (a failed build
          or an unrelated VM). Check it, remove it with
          'qm destroy {{ template_vmid }} --purge', and re-run.
      when:
        - template_config.rc == 0
        - "'template: 1' not in template_config.stdout_lines"

    # A failure partway destroys the shell so the next run starts clean.
    - name: Create template
      when: template_config.rc != 0
      block:
        - name: Create VM shell
          ansible.builtin.command: >-
            qm create {{ template_vmid }}
            --name {{ template_name }}
            --ostype l26 --cpu host --cores 2 --memory 2048
            --scsihw virtio-scsi-single
            --net0 virtio,bridge={{ pve_lab_bridge }}
            --agent enabled=1
            --serial0 socket --vga serial0

        - name: Import cloud image as boot disk
          ansible.builtin.command: >-
            qm set {{ template_vmid }}
            --scsi0 {{ template_storage }}:0,import-from={{ template_image_path }},discard=on,iothread=1,ssd=1
            --ide2 {{ template_storage }}:cloudinit
            --boot order=scsi0

        - name: Convert to template
          ansible.builtin.command: qm template {{ template_vmid }}

      rescue:
        - name: Destroy partial template
          ansible.builtin.command: qm destroy {{ template_vmid }} --purge 1
          failed_when: false

        - name: Report template failure
          ansible.builtin.fail:
            msg: >-
              Building the template failed at '{{ ansible_failed_task.name }}':
              {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('') }}.
              The partial VM was destroyed; fix the cause and re-run.
