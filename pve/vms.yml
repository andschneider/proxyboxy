---
# Creates the VMs listed in pve_vms (host_vars/pr3.yml) from the cloud-init
# template. Only creates missing VMs; it doesn't reconcile changes to existing
# ones (edit those in the UI or with qm set).
#
#   make pve-vms
- name: Provision VMs
  hosts: pve
  gather_facts: false

  tasks:
    - name: Copy SSH public key for cloud-init
      ansible.builtin.copy:
        src: "{{ vm_ssh_pubkey }}"
        dest: /root/vm_authorized_keys
        mode: "0600"

    - name: Create VMs
      ansible.builtin.include_tasks: tasks/vm.yml
      loop: "{{ pve_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
