---
pve:
  hosts:
    pr3:
      ansible_host: 10.10.0.7
      ansible_user: root

# VMs, created by Terraform (pve/terraform). Their hosts come from
# terraform-inventory.yml; these vars apply to all of them.
lab:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/homelab_ed25519
