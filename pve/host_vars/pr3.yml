---
# Disks are referenced by /dev/disk/by-id so kernel renumbering (nvme0n1 vs
# nvme2n1, sda vs sdd) can't point a pool at the wrong drive.
zfs_pools:
  - name: fast
    vdev: mirror
    disks:
      - nvme-WDS100T3X0C-00SJG0_20390C804910
      - nvme-WDS100T3X0C-00SJG0_20390C804929
  - name: tank
    vdev: mirror
    disks:
      - ata-CT2000MX500SSD1_2115E5975ABF
      - ata-CT2000MX500SSD1_2115E5975C4A
  - name: backup
    vdev: ""
    disks:
      - ata-ST4000VN008-2DR166_ZGY73D0C
  # Single 1TB MX500, no redundancy: throwaway VMs and ISOs only.
  - name: scratch
    vdev: ""
    disks:
      - ata-CT1000MX500SSD1_2052E4E1E9BB

# PVE storage entries backed by the pools above.
pve_zfs_storages:
  - id: fast
    pool: fast
    content: images,rootdir
  - id: tank
    pool: tank
    content: images,rootdir
  - id: scratch
    pool: scratch
    content: images,rootdir

# Directory storages on ZFS datasets (mounted at /<dataset>).
pve_dir_storages:
  - id: backup
    dataset: backup/vzdump
    content: backup
    prune: keep-daily=7,keep-weekly=4,keep-monthly=6
  - id: iso
    dataset: scratch/iso
    content: iso,vztmpl,snippets

# 125 GiB RAM; leave the bulk for VMs.
zfs_arc_max_gib: 16

journald_max_use: 200M

# Cloud-init template (pve/template.yml), pinned to a dated build so the URL and
# checksum always match. To move to a newer build: update the URL, name and
# checksum (from that build's SHA256SUMS), then rebuild the template with
# `qm destroy 9000 --purge` and `make pve-template`. Existing VMs are unaffected.
pve_iso_storage: iso
pve_iso_dataset: scratch/iso
template_vmid: 9000
template_name: ubuntu-2604-cloud
template_storage: fast
template_image_name: ubuntu-26.04-server-cloudimg-amd64-20260927.img
template_image_url: https://cloud-images.ubuntu.com/releases/26.04/release-20260927/ubuntu-26.04-server-cloudimg-amd64.img
template_image_sha256: 8800651811af9a85465ad1d552add729947bb16488dddb4a9b5305a3d97332b2
template_vendor_snippet: vendor-base.yaml

# Lab VMs use their own bridge on a NIC whose switch port is untagged lab.
pve_lab_bridge: vmbr1
pve_lab_bridge_port: nic2

# VM defaults (pve/vms.yml). VMs attach to the lab bridge; VMID = last IP octet.
# .100-.109 core services (monitor, files), .110+ apps and databases.
vm_user: ubuntu
vm_ssh_pubkey: "{{ lookup('env', 'HOME') }}/.ssh/homelab_ed25519.pub"
vm_gateway: 10.20.0.1
vm_nameserver: 192.168.1.6
vm_searchdomain: lab.andschneider.net

pve_vms:
  - name: monitor
    vmid: 100
    ip: 10.20.0.100
    cores: 2
    memory_mb: 4096
    storage: fast
    disk_gb: 64
  - name: postgres
    vmid: 110
    ip: 10.20.0.110
    cores: 4
    memory_mb: 8192
    storage: fast
    disk_gb: 64

# Prometheus PVE exporter (pve/monitoring.yml), installed in a venv on pr3.
pve_exporter_version: 3.10.1
