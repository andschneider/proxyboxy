---
# Installs and configures PostgreSQL from the PGDG repo on the postgres VM.
#
#   make postgres
- name: PostgreSQL
  hosts: postgres
  become: true
  # Run queued restarts even if a later task fails, so a re-run doesn't
  # find the config already in place and skip the restart.
  force_handlers: true

  vars:
    postgres_conf_dir: "/etc/postgresql/{{ postgres_version }}/main"

  handlers:
    - name: Restart postgresql
      ansible.builtin.systemd_service:
        name: postgresql@{{ postgres_version }}-main
        state: restarted

    - name: Reload postgresql
      ansible.builtin.systemd_service:
        name: postgresql@{{ postgres_version }}-main
        state: reloaded

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - acl
          - ca-certificates
        update_cache: true

    - name: Add PGDG signing key
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /usr/share/keyrings/postgresql.asc
        mode: "0644"

    - name: Add PGDG repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pgdg.sources
        content: |
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: {{ ansible_facts['distribution_release'] }}-pgdg
          Components: main
          Signed-By: /usr/share/keyrings/postgresql.asc
        mode: "0644"

    # unattended-upgrades only covers Ubuntu's own repos by default. This adds
    # PGDG so minor releases (18.x security and bug fixes) install on their
    # own; a new major version is a separate package and stays manual.
    - name: Allow unattended upgrades from PGDG
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-pgdg
        content: |
          // Managed by Ansible (pve/postgres.yml).
          Unattended-Upgrade::Origins-Pattern {
              "origin=apt.postgresql.org,codename=${distro_codename}-pgdg";
          };
        mode: "0644"

    # After the PGDG repo, so libpq5 (pulled in by psycopg2) comes from PGDG
    # rather than the older Ubuntu build.
    - name: Install PostgreSQL {{ postgres_version }}
      ansible.builtin.apt:
        name:
          - postgresql-{{ postgres_version }}
          - python3-psycopg2
        update_cache: true

    - name: Configure server settings
      ansible.builtin.copy:
        dest: "{{ postgres_conf_dir }}/conf.d/90-ansible.conf"
        content: |
          # Managed by Ansible (pve/postgres.yml).
          {% for key, value in postgres_settings.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
        owner: postgres
        group: postgres
        mode: "0644"
      notify: Restart postgresql

    - name: Configure client authentication
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: "{{ postgres_conf_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"
      notify: Reload postgresql

    - name: Start PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql@{{ postgres_version }}-main
        state: started
        enabled: true

    # Apply config changes before creating roles, so password_encryption is set.
    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers

    - name: Create roles
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password | default(omit) }}"
        role_attr_flags: "{{ item.flags | default('LOGIN') }}"
      loop: "{{ postgres_roles }}"
      loop_control:
        label: "{{ item.name }}"
      become_user: postgres
      no_log: true

    - name: Create databases
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner }}"
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"
      become_user: postgres
