---
# Dedicated user + API token for later VM-provisioning playbooks, replacing
# the old plaintext root password. The secret is only shown once, so it's
# saved locally to pve/secrets/ (gitignored). no_log keeps it out of -v output.
- name: Check for ansible user
  ansible.builtin.command: pveum user list --output-format json
  register: pve_users
  changed_when: false

- name: Create ansible user
  ansible.builtin.command: pveum user add ansible@pve --comment "Ansible automation"
  when: "'ansible@pve' not in (pve_users.stdout | from_json | map(attribute='userid') | list)"

- name: Grant ansible user PVEAdmin
  ansible.builtin.command: pveum acl modify / --users ansible@pve --roles PVEAdmin
  changed_when: false

- name: Check for token
  ansible.builtin.command: pveum user token list ansible@pve --output-format json
  register: pve_tokens
  changed_when: false

- name: Check for local token secret
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/secrets/{{ inventory_hostname }}-ansible-token.json"
  delegate_to: localhost
  register: pve_token_file

# PVE only reveals a token secret at creation, so a token without a saved
# secret is unusable.
- name: Fail if the token exists but its secret was never saved
  ansible.builtin.fail:
    msg: >-
      Token ansible@pve!automation exists on {{ inventory_hostname }} but
      {{ pve_token_file.stat.path }} is missing. Remove the token with
      'pveum user token remove ansible@pve automation' and re-run with --tags token.
  when:
    - "'automation' in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)"
    - not pve_token_file.stat.exists

- name: Create token
  ansible.builtin.command: >-
    pveum user token add ansible@pve automation --privsep 0 --output-format json
  register: pve_new_token
  no_log: true
  when: "'automation' not in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)"

- name: Create local secrets dir
  ansible.builtin.file:
    path: "{{ playbook_dir }}/secrets"
    state: directory
    mode: "0700"
  delegate_to: localhost
  when: pve_new_token is changed

- name: Save token secret locally
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/secrets/{{ inventory_hostname }}-ansible-token.json"
    content: "{{ pve_new_token.stdout | from_json | to_nice_json }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  diff: false
  when: pve_new_token is changed
