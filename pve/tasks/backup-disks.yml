---
# Makes each data disk's backup flag match `backup:` in pve_vms, for one VM.
# vm.yml sets the flag at creation; this catches later changes in either
# direction. Data disks are scsi1, scsi2, ... in data_disks order, numbered
# the same way as in tasks/vm.yml.
- name: Read config of {{ vm.name }}
  ansible.builtin.command: qm config {{ vm.vmid }}
  register: backup_vm_config
  changed_when: false
  failed_when: false

# A VM listed in pve_vms but not created yet gets the flag from vms.yml.
- name: Reconcile disk backup flags on {{ vm.name }}
  when: backup_vm_config.rc == 0
  block:
    - name: Check data disks of {{ vm.name }} exist
      ansible.builtin.assert:
        that: "('scsi' ~ (idx + 1) ~ ': ') in backup_vm_config.stdout"
        fail_msg: >-
          {{ vm.name }} has no scsi{{ idx + 1 }}, but pve_vms lists data disk
          {{ idx + 1 }}. Fix pve_vms or reattach the disk.
        quiet: true
      loop: "{{ vm.data_disks }}"
      loop_control:
        index_var: idx
        label: "scsi{{ idx + 1 }}"

    - name: Set disk backup flags on {{ vm.name }}
      ansible.builtin.command: >-
        qm set {{ vm.vmid }} --scsi{{ idx + 1 }}
        {{ disk_opts }}{{ '' if wanted | bool else ',backup=0' }}
      loop: "{{ vm.data_disks }}"
      loop_control:
        loop_var: disk
        index_var: idx
        label: "scsi{{ idx + 1 }} backup={{ wanted | bool | int }}"
      vars:
        wanted: "{{ disk.backup | default(true) | bool }}"
        disk_line: >-
          {{ backup_vm_config.stdout
             | regex_search('^scsi' ~ (idx + 1) ~ ': (.*)$', '\1', multiline=True) | first }}
        excluded: "{{ disk_line is search('(^|,)backup=0(,|$)') }}"
        # Live options minus any backup flag; omitting it means backup=1.
        disk_opts: "{{ disk_line | regex_replace(',backup=[01]', '') }}"
      when: wanted | bool == excluded | bool
