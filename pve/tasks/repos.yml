---
# Swap the enterprise repos (need a subscription) for no-subscription.
- name: Remove enterprise repositories
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - ceph.sources
    - pve-enterprise.list
    - ceph.list

- name: Add pve-no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Full upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  register: pve_upgrade

- name: Install extra packages
  ansible.builtin.apt:
    name:
      - ipmitool
      - nvme-cli

- name: Check whether a reboot is needed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: pve_reboot_required

- name: Note pending reboot
  ansible.builtin.debug:
    msg: "Upgrade installed a new kernel; reboot when convenient."
  when: pve_reboot_required.stat.exists or (pve_upgrade.stdout | default('') is search('proxmox-kernel'))
