name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          # Same version as local, so fmt output matches.
          terraform_version: 1.14.8
      - run: terraform fmt -check -diff -recursive pve/terraform

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      # Same ansible and ansible-lint as local, from uv.lock. Config and
      # skipped rules are in .ansible-lint.
      - run: uv run --locked ansible-lint pve/
